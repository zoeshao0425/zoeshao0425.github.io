# Site settings for zoeshao0425.github.io
# Theme: https://github.com/luost26/academic-homepage
#
# This file is NOT reloaded automatically by `bundle exec jekyll serve`.
# Restart the server after editing it.

title: "Zilei Shao"
description: >-
  Zilei (Zoe) Shao is a Ph.D. student in Computer Science at UCLA, working with
  Guy Van den Broeck in the StarAI Lab on tractable probabilistic models,
  deep generative models, and tokenization in large language models.
url: "https://zoeshao0425.github.io"

# This is a GitHub user site served from the domain root, so there is no subpath.
baseurl: ""

# Build settings
markdown: kramdown

plugins:
  # Obfuscates the mailto: address against scrapers. GitHub Pages' default build
  # does not load this plugin, in which case Liquid passes the address through
  # unchanged and the link still works.
  - jekyll-email-protect

collections:
  - publications
  - news
  - showcase

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - tools
  - .legacy_academicpages
  - README.md
