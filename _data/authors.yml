# Author registry for _includes/widgets/author_list.html
#
# Each top-level key is the exact author string used in publication front matter,
# WITHOUT any trailing "*" (equal contribution) or "#" (corresponding author) mark
# -- the include strips those marks before looking the author up here.
#
# Per-author options (all optional):
#   name:  display override; defaults to the key itself
#   url:   personal homepage; renders the name as a link (omit -> plain text)
#   bold:  true to render the name in bold (used for the site owner)
#
# If a key has no entry at all, the include still falls back to the raw key.
# Every author appearing in a publication is listed here anyway, so the file
# doubles as a complete roster.

# ----- Site owner -----

