short_bio_text_justify: true
short_bio: >-
  <p>
    I am a Ph.D. student in Computer Science at the University of California, Los Angeles, advised by
    Prof. <a href="https://web.cs.ucla.edu/~guyvdb/" target="_blank">Guy Van den Broeck</a> in the
    <a href="http://starai.cs.ucla.edu/" target="_blank">StarAI Lab</a>. I go by <strong>Zoe</strong>.
  </p>
  <p>
    My research integrates tractable probabilistic models into modern neural architectures to improve the
    training efficiency, inference quality, and controllability of deep generative models. I also develop
    optimization techniques for probabilistic and generative models, spanning parameter learning,
    low-variance gradient estimation, and differentiable routing in large-scale architectures. In a related
    line of work, I study tokenization in Large Language Models (LLMs) as a neurosymbolic problem, showing
    that non-canonical tokenizations of the same input can substantially change model behavior, with the
    broader goal of making these large-scale systems more tractable and reliable.
  </p>
  <p>
    Before my doctoral studies, I earned my Bachelor of Science degree in a joint major of Computer Science
    and Mathematics at <a href="https://www.hmc.edu" target="_blank">Harvey Mudd College</a>, where I was
    deeply involved in bounding-box inference within the context of model-based Reinforcement Learning under
    the supervision of Prof.
    <a href="https://sites.google.com/g.hmc.edu/erinjtalvitie" target="_blank">Erin Talvitie</a>.
  </p>

